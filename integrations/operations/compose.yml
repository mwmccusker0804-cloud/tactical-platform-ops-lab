name: tpol-operations
services:
  demo:
    image: python:3.12.12-slim-bookworm
    mem_limit: 128m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
    - 127.0.0.1:18080:8080
    volumes:
    - ./exercise_server.py:/app/server.py:ro
    - events:/events
    command:
    - python
    - /app/server.py
    - demo
  inbox:
    image: python:3.12.12-slim-bookworm
    mem_limit: 128m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
    - 127.0.0.1:18081:8080
    volumes:
    - ./exercise_server.py:/app/server.py:ro
    - events:/events
    command:
    - python
    - /app/server.py
    - inbox
  prometheus:
    image: prom/prometheus:v3.13.4
    mem_limit: 512m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
    - 127.0.0.1:19090:9090
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./rules.yml:/etc/prometheus/rules.yml:ro
    - prometheus:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=24h
    - --storage.tsdb.retention.size=1GB
  blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.29.0
    mem_limit: 128m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    volumes:
    - ./blackbox.yml:/etc/blackbox.yml:ro
    command:
    - --config.file=/etc/blackbox.yml
  alertmanager:
    image: prom/alertmanager:v0.34.1
    mem_limit: 128m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
    - 127.0.0.1:19093:9093
    volumes:
    - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alerts:/alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --data.retention=24h
  loki:
    image: grafana/loki:3.7.0
    mem_limit: 512m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
    - 127.0.0.1:13100:3100
    volumes:
    - ./loki.yml:/etc/loki/config.yml:ro
    - loki:/loki
    command:
    - -config.file=/etc/loki/config.yml
  alloy:
    image: grafana/alloy:v1.20.1
    mem_limit: 256m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    volumes:
    - ./config.alloy:/etc/alloy/config.alloy:ro
    - events:/events:ro
    - alloy:/var/lib/alloy
    command:
    - run
    - --storage.path=/var/lib/alloy
    - /etc/alloy/config.alloy
  grafana:
    image: grafana/grafana:13.2.3
    mem_limit: 384m
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
    - 127.0.0.1:13000:3000
    volumes:
    - ./datasources.yml:/etc/grafana/provisioning/datasources/lab.yml:ro
    - ./dashboard-provider.yml:/etc/grafana/provisioning/dashboards/lab.yml:ro
    - ./dashboard.json:/var/lib/grafana/dashboards/lab.json:ro
    - grafana:/var/lib/grafana
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
volumes:
  prometheus: {}
  grafana: {}
  loki: {}
  alloy: {}
  alerts: {}
  events: {}
