name: tpol-redpanda
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - '1'
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    mem_limit: 1536m
    ports:
      - '127.0.0.1:19092:19092'
      - '127.0.0.1:19644:9644'
    volumes:
      - records:/var/lib/redpanda/data
  console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    mem_limit: 512m
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - '127.0.0.1:8088:8080'
    depends_on:
      - redpanda
volumes:
  records:
